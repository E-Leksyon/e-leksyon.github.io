<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Leksyon: Choose Your President!</title>
    <link rel="stylesheet" href="E-Leksyon.css">
    
</head>
<body>
    <div id="game-container">
    
        <div id="start-screen">
            <h1>E-Leksyon: Choose Your President</h1>
            <button id="start-btn">Start Game</button>
        </div>

        <div id="game-screen">
            <div id="background-layer"></div>

            <div id="fade-overlay"></div>
            <button id="return-btn">⮜ Back</button>

            <div id="character-layer">
                <img id="character-img" src="" alt="Character">
            </div>

            <div id="choices-container">
                </div>

            <div id="dialogue-box">
                <div id="speaker-name">Name</div>
                <div id="dialogue-text"></div>
                <div id="next-indicator">▼</div>
            </div>
        </div>

    </div>
    <audio id="bgm-audio" loop></audio>
    <script src="E-Leksyon.js"> </script>
</body>
</html>
